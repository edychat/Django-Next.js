# Manual run (no mobile services): DOCKER_BUILDKIT=1 docker compose -f dev.yml up -d --build db backend frontend
# To build/start the docker dev environment run: ./dev.sh
#
# ML Service Architecture:
#   Development (Local): ML built into Django backend at /ml_service/ endpoints
#   Deployment (Cloud): Lightweight backend + External ML service (REQUIRED)
#     - MUST set ML_SERVICE_URL environment variable to external ML service

volumes:
  db_data:
  redis_data:
  frontend_node_modules:
  frontend_next:

# Join the shared traefik network so the global Traefik can reach containers
networks:
  traefik:
    external: true
  default:
    driver: bridge

services:

  backend:
    build:
      context: .
      dockerfile: backend/config/Dockerfile.development
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-true}"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "postgres"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      EXPO_PUBLIC_ENV: "development"
      ML_SERVICE_URL: "${ML_SERVICE_URL:-}"
    volumes:
      - ./backend:/backend:delegated
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - default
      - traefik
    labels:
      # Tell global Traefik to route ${PROJECT_HOST}.localhost/api → this container
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # API routes — localhost (high priority)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.rule=Host(`${PROJECT_HOST}.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.middlewares=${COMPOSE_PROJECT_NAME}-strip-api,${COMPOSE_PROJECT_NAME}-compress"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-strip-api.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-compress.compress=true"
      # API routes — tunnel / any other hostname (lower priority, no Host constraint)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-tunnel.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-tunnel.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-tunnel.priority=50"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-tunnel.middlewares=${COMPOSE_PROJECT_NAME}-strip-api,${COMPOSE_PROJECT_NAME}-compress"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api-tunnel.service=${COMPOSE_PROJECT_NAME}-backend"
      # Admin / static / media routes — localhost (high priority)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.rule=Host(`${PROJECT_HOST}.localhost`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.middlewares=${COMPOSE_PROJECT_NAME}-compress"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-static.rule=Host(`${PROJECT_HOST}.localhost`) && PathPrefix(`/static`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-static.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-static.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-media.rule=Host(`${PROJECT_HOST}.localhost`) && PathPrefix(`/media`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-media.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-media.priority=100"
      # Admin / static / media routes — tunnel / any other hostname (lower priority)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-tunnel.rule=PathPrefix(`/admin`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-tunnel.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-tunnel.priority=50"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-tunnel.middlewares=${COMPOSE_PROJECT_NAME}-compress"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-tunnel.service=${COMPOSE_PROJECT_NAME}-backend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-static-tunnel.rule=PathPrefix(`/static`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-static-tunnel.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-static-tunnel.priority=50"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-static-tunnel.service=${COMPOSE_PROJECT_NAME}-backend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-media-tunnel.rule=PathPrefix(`/media`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-media-tunnel.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-media-tunnel.priority=50"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-media-tunnel.service=${COMPOSE_PROJECT_NAME}-backend"
      # Backend service port
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-api.service=${COMPOSE_PROJECT_NAME}-backend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.service=${COMPOSE_PROJECT_NAME}-backend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-static.service=${COMPOSE_PROJECT_NAME}-backend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-media.service=${COMPOSE_PROJECT_NAME}-backend"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: "development"
      NEXT_TELEMETRY_DISABLED: "1"
      # NUMBER in ms, not "true" — "true" silently defaults to 5007ms (too slow).
      # Polling is needed on macOS (Podman VM) and Windows (WSL2).
      WATCHPACK_POLLING: "500"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      NEXT_PUBLIC_URL: "http://${PROJECT_HOST}.localhost"
      NEXT_PUBLIC_API_URL: "/api"
    volumes:
      - ./frontend/web:/app:z
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    # Expose port 3000 directly — HMR WebSocket connects back to the page
    # hostname/port. When accessed via Traefik on port 80 the browser sends
    # the WS upgrade to port 80, which Traefik forwards fine. But direct
    # access on :3000 also works (useful for debugging / Windows WSL2 setups).
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s --max-time 5 -o /dev/null http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 120s
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # ── HMR WebSocket router (highest priority, no compression middleware) ──
      # Must be separate from the main frontend router — the compress middleware
      # breaks WebSocket upgrade headers, killing hot reload in the browser.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hmr.rule=Host(`${PROJECT_HOST}.localhost`) && PathPrefix(`/_next/webpack-hmr`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hmr.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hmr.priority=200"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hmr.service=${COMPOSE_PROJECT_NAME}-frontend"
      # HMR — tunnel hostname
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hmr-tunnel.rule=PathPrefix(`/_next/webpack-hmr`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hmr-tunnel.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hmr-tunnel.priority=150"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-hmr-tunnel.service=${COMPOSE_PROJECT_NAME}-frontend"
      # ── Main frontend router ──────────────────────────────────────────────
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.rule=Host(`${PROJECT_HOST}.localhost`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend.service=${COMPOSE_PROJECT_NAME}-frontend"
      # Frontend — tunnel / any other hostname (catch-all)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend-tunnel.rule=PathPrefix(`/`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend-tunnel.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend-tunnel.priority=1"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-frontend-tunnel.service=${COMPOSE_PROJECT_NAME}-frontend"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-frontend.loadbalancer.server.port=3000"
    restart: unless-stopped

  eas-build:
    profiles: ["eas"]
    image: node:24-alpine
    working_dir: /app
    env_file:
      - .env
    environment:
      APP: "${APP:-all}"
      PLATFORM: "${PLATFORM:-ios}"
      PROFILE: "${PROFILE:-development}"
    volumes:
      - ./frontend/mobile:/app
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl git bash &&
        npm install -g eas-cli --silent &&
        eas whoami || (echo '❌ EXPO_TOKEN is not set in .env' && exit 1) &&
        echo '📦 Running EAS build for $$APP on $$PLATFORM...' &&
        /mobile.sh eas-build

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always


# Initialization Section ------------------
  backend-init:
    profiles: ["init"]
    image: python:3.11-slim
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "echo '✅ Backend initialization complete!'"

  frontend-init:
    profiles: ["init"]
    image: node:24
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: >
      sh -c "
        echo '📦 Starting frontend initialization...' &&
        npm install -g npm@latest &&
        echo '🔄 Backing up custom files...' &&
        mkdir -p /tmp/backup &&
        if [ -f Dockerfile ]; then cp Dockerfile /tmp/backup/; fi &&
        if [ -f next.config.ts ]; then cp next.config.ts /tmp/backup/; fi &&
        if [ -f app/components/api.ts ]; then mkdir -p /tmp/backup/app/components && cp app/components/api.ts /tmp/backup/app/components/; fi &&
        echo '🧹 Cleaning frontend directory completely...' &&
        rm -rf /app/* /app/.* 2>/dev/null || true &&
        echo '🏗  Running create-next-app...' &&
        npx create-next-app@latest . --typescript --tailwind --eslint --app --src-dir=false --import-alias='@/*' --turbopack --no-git &&
        echo '📦 Installing dependencies...' &&
        npm install &&
        echo '🔙 Restoring custom files...' &&
        if [ -f /tmp/backup/Dockerfile ]; then mv /tmp/backup/Dockerfile ./; fi &&
        if [ -f /tmp/backup/next.config.ts ]; then mv /tmp/backup/next.config.ts ./; fi &&
        if [ -f /tmp/backup/app/components/api.ts ]; then mkdir -p app/components && mv /tmp/backup/app/components/api.ts app/components/; fi &&
        echo '✅ Frontend initialization complete!'
      "

  app-init:
    profiles: ["init"]
    image: python:3.11-slim
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "
      apt-get update &&
      apt-get install -y sed &&
      pip install --upgrade pip --root-user-action=ignore &&
      pip install django python-decouple djangorestframework django-cors-headers --root-user-action=ignore &&
      django-admin startapp ${APP_NAME:-app}
      "
    environment:
      - APP_NAME=${APP_NAME:-app}

# Backup Section ------------------
  backup-snapshot:
    profiles: ["backup"]
    image: postgres:17
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-postgres}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DJANGO_DEBUG: "true"
      FULL_BACKUP: "${FULL_BACKUP:-false}"
    volumes:
      - ./backend:/backend
    working_dir: /backend/backup
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo '📦 Installing required packages...' &&
        apt-get update -qq &&
        apt-get install -y -qq postgresql-client gzip tar cpio > /dev/null 2>&1 &&
        echo '✅ Packages installed' &&
        FULL_BACKUP=true /backend/backup/backup.sh snapshot
      "

  backup-restore:
    profiles: ["backup"]
    image: postgres:17
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-postgres}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      RESTORE_ARCHIVE: "${RESTORE_ARCHIVE:-}"
      DJANGO_DEBUG: "true"
    volumes:
      - ./backend:/backend
    working_dir: /backend/backup
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c '
        if [ -z "$${RESTORE_ARCHIVE}" ]; then
          echo "❌ Error: Backup archive path required";
          echo "Usage: RESTORE_ARCHIVE=/backend/backup/snapshots/<file.tar.gz> docker compose -f dev.yml --profile backup run --rm backup-restore";
          echo "";
          echo "Available backups:";
          /backend/backup/backup.sh list;
          exit 1;
        fi &&
        echo "📦 Installing required packages..." &&
        apt-get update -qq &&
        apt-get install -y -qq postgresql-client gzip tar cpio > /dev/null 2>&1 &&
        echo "✅ Packages installed" &&
        /backend/backup/backup.sh restore
      '

  backup-list:
    profiles: ["backup"]
    image: postgres:17
    volumes:
      - ./backend:/backend
    working_dir: /backend/backup
    environment:
      DJANGO_DEBUG: "true"
    command: /backend/backup/backup.sh list
